<style>
:root{--blue:#2438ff;--sun:#ffd23f;--ink:#12141f;--mist:#eef1f6;--white:#fff;--coral:#ff5a3c;--r:18px}
*{box-sizing:border-box;margin:0}
html{scroll-behavior:smooth}
body{font:400 1.0625rem/1.6 "DM Sans",system-ui,sans-serif;color:var(--ink);background:var(--mist)}
h1,h2,h3{font-family:"Bricolage Grotesque","DM Sans",sans-serif;line-height:1.02;letter-spacing:-.03em}
a{color:inherit}
:focus-visible{outline:3px solid var(--coral);outline-offset:3px}
.wrap{max-width:1120px;margin:0 auto;padding:0 24px}
section{padding:96px 0}
h2{font-size:clamp(2rem,5vw,3.4rem);font-weight:800;max-width:16ch}
.lead{max-width:56ch;margin-top:18px;color:#454a5e}
/* header */
header{position:sticky;top:0;z-index:20;background:rgba(238,241,246,.9);backdrop-filter:blur(10px)}
.nav{display:flex;align-items:center;gap:20px;height:68px}
.logo{font:800 1.4rem "Bricolage Grotesque",sans-serif;text-decoration:none;letter-spacing:-.04em;margin-right:auto}
.logo i{display:inline-block;width:.7em;height:.7em;background:var(--blue);border-radius:50% 50% 0 0;margin-right:6px}
.nav a.l{text-decoration:none;font-weight:500;font-size:.95rem}
.nav a.l:hover{color:var(--blue)}
.lang{display:flex;border:2px solid var(--ink);border-radius:99px;overflow:hidden}
.lang button{font:700 .8rem "DM Sans";background:none;border:0;padding:6px 12px;cursor:pointer;color:var(--ink)}
.lang button[aria-pressed=true]{background:var(--ink);color:var(--white)}
.btn{display:inline-block;background:var(--blue);color:var(--white);font-weight:700;text-decoration:none;padding:15px 26px;border-radius:99px;border:0;font-size:1rem;cursor:pointer;font-family:inherit;transition:transform .15s,background .15s}
.btn:hover{background:var(--ink);transform:translateY(-2px)}
.btn.alt{background:none;color:var(--ink);box-shadow:inset 0 0 0 2px var(--ink)}
.btn.alt:hover{background:var(--ink);color:var(--white)}
/* hero */
.hero{padding:56px 0 100px}
.hero .wrap{display:grid;grid-template-columns:1.05fr .95fr;gap:56px;align-items:center}
.hero h1{font-size:clamp(2.6rem,7vw,5.2rem);font-weight:800}
.hero p{font-size:1.2rem;margin:24px 0 32px;max-width:46ch;color:#454a5e}
.cta{display:flex;gap:12px;flex-wrap:wrap}
.shop{position:relative;padding-top:6px}
.awning{--s:40px;height:64px;border-radius:8px 8px 0 0;position:relative;z-index:2;transform-origin:top;animation:drop .9s cubic-bezier(.3,1.4,.5,1) .2s both;background:repeating-linear-gradient(90deg,var(--blue) 0 var(--s),var(--white) var(--s) calc(var(--s)*2));box-shadow:0 10px 0 -4px rgba(0,0,0,.08)}
.awning::after{content:"";position:absolute;left:0;right:0;top:100%;height:20px;background:inherit;-webkit-mask:radial-gradient(circle at 20px 0,#000 19.5px,transparent 20px) 0 0/40px 20px repeat-x;mask:radial-gradient(circle at 20px 0,#000 19.5px,transparent 20px) 0 0/40px 20px repeat-x}
@keyframes drop{from{transform:scaleY(0)}}
.win{background:var(--white);border-radius:0 0 var(--r) var(--r);margin-top:-2px;padding-top:34px;box-shadow:0 30px 60px -20px rgba(18,20,31,.35);overflow:hidden}
.bar{display:flex;align-items:center;gap:6px;padding:10px 16px;background:var(--ink);color:#aab;font-size:.8rem}
.bar b{width:9px;height:9px;border-radius:50%;background:var(--coral)}.bar b:nth-child(2){background:var(--sun)}.bar b:nth-child(3){background:#3ddc84}
.bar span{margin-left:10px;background:#252838;border-radius:99px;padding:3px 14px;flex:1}
.site{padding:26px 22px 30px}
.site .t{font:800 1.7rem/1 "Bricolage Grotesque";letter-spacing:-.03em}
.site .ln{height:9px;border-radius:9px;background:var(--mist);margin:10px 0;width:90%}.site .ln.s{width:60%}
.site .row{display:flex;gap:10px;margin-top:20px}
.site .row div{flex:1;height:70px;border-radius:12px;background:var(--sun)}.site .row div:nth-child(2){background:var(--coral)}.site .row div:nth-child(3){background:var(--blue)}
.pill{display:inline-block;background:var(--ink);color:var(--white);font-size:.8rem;font-weight:700;padding:8px 16px;border-radius:99px;margin-top:18px}
/* services */
#servizi{background:var(--ink);color:var(--white)}
#servizi .lead{color:#b8bcd0}
.list{margin-top:48px;border-top:1px solid #2b2f44}
.item{display:grid;grid-template-columns:minmax(200px,1fr) 2fr;gap:24px;padding:28px 0;border-bottom:1px solid #2b2f44}
.item h3{font-size:1.6rem;font-weight:800;color:var(--sun)}
.item p{color:#c9ccdc;max-width:60ch}
/* examples */
.demo{display:grid;grid-template-columns:repeat(3,1fr);gap:24px;margin-top:48px}
.m{border-radius:var(--r);padding:26px;min-height:320px;display:flex;flex-direction:column;justify-content:space-between}
.m:nth-child(1){background:var(--sun);border-radius:var(--r) var(--r) 120px var(--r)}
.m:nth-child(2){background:var(--ink);color:var(--white)}
.m:nth-child(3){background:var(--coral);color:var(--white);border-radius:120px var(--r) var(--r) var(--r)}
.m small{font-weight:700;font-size:.85rem;opacity:.75}
.m h3{font-size:2rem;font-weight:800;margin:10px 0}
.m p{font-size:.95rem;opacity:.9}
.m .pill{background:var(--white);color:var(--ink);align-self:flex-start}
/* process */
.steps{display:grid;grid-template-columns:repeat(4,1fr);gap:0;margin-top:48px;counter-reset:s}
.step{padding:0 24px 0 0;border-top:4px solid var(--ink);padding-top:22px;counter-increment:s}
.step:nth-child(2){border-color:var(--blue)}.step:nth-child(3){border-color:var(--coral)}.step:nth-child(4){border-color:var(--sun)}
.step::before{content:counter(s);font:800 3rem/1 "Bricolage Grotesque"}
.step h3{font-size:1.35rem;font-weight:800;margin:12px 0 8px}
.step p{font-size:.97rem;color:#454a5e}
/* why */
.why{background:var(--blue);color:var(--white)}
.why .wrap{display:grid;grid-template-columns:1fr 1fr;gap:56px;align-items:start}
.why ul{list-style:none;padding:0}
.why li{padding:18px 0;border-bottom:1px solid rgba(255,255,255,.3);font-size:1.15rem;font-weight:500}
.why li:first-child{padding-top:0}
/* contact */
form{margin-top:36px;display:grid;gap:14px;max-width:560px}
label{font-weight:700;font-size:.9rem;display:grid;gap:6px}
input,textarea{font:inherit;padding:14px 16px;border-radius:12px;border:2px solid #cfd5e2;background:var(--white)}
input:focus,textarea:focus{border-color:var(--blue);outline:0}
.ct{display:grid;grid-template-columns:1fr 1fr;gap:56px}
.ct .big a{font:800 clamp(1.4rem,3vw,2rem) "Bricolage Grotesque";text-decoration:none;display:block;margin-bottom:10px;word-break:break-word}
.ct .big a:hover{color:var(--blue)}
footer{background:var(--ink);color:#b8bcd0;padding:32px 0;font-size:.9rem}
footer .wrap{display:flex;justify-content:space-between;flex-wrap:wrap;gap:10px}
@media(max-width:860px){
section{padding:68px 0}
.hero .wrap,.why .wrap,.ct{grid-template-columns:1fr;gap:40px}
.item{grid-template-columns:1fr;gap:8px}
.demo{grid-template-columns:1fr}
.steps{grid-template-columns:1fr 1fr;row-gap:36px}
.nav a.l{display:none}
}
@media(max-width:480px){.steps{grid-template-columns:1fr}.nav .btn{display:none}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
</style>
</head>
